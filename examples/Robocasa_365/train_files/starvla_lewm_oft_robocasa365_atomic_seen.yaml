run_id: lewm_oft_robocasa365_atomic_seen
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_robocasa365
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: ./dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: false
    num_views: 3
    use_future_latent: true
    n_future: 2
    ctx_len: 1
    predictor_dim: 384
    predictor_layers: 4
    predictor_heads: 6
    predictor_ffn: 1024
    flow_sample_steps: 10
    action_source: oft
    loss_latent_weight: 0.0
    loss_action_weight: 0.5
    use_delta_head: true
    loss_delta_weight: 1.0
    delta_head_type: transformer
    delta_head_dim: 384
    delta_head_depth: 4
    delta_head_heads: 6
    delta_head_ffn: 1024
    delta_head_sigreg_weight: 0.02
    delta_head_condition_on_action: false
    delta_head_inference: true
    oft_future_from_delta: true
    use_visual_token_wm: true
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    latent_stats_momentum: 0.99
    use_state_probe: false
    use_state_cond: true
    state_cond_dim: 32
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
  action_model:
    action_model_type: MLP
    action_dim: 12
    state_dim: 0
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    action_hidden_dim: 384
  lang_cond:
    num_buckets: 65536
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/robocasa365
    data_mix: robocasa365_atomic_target_human_wm
    future_obs_frames: true
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av

trainer:
  max_train_steps: 200000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 2000
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
    backbone:
      encoder: 1.0e-06
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08