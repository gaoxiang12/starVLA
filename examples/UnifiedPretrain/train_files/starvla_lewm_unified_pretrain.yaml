run_id: starvla_lewm_unified_pretrain
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_UnifiedPretrain
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: dino_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: true
    num_views: 3
    n_future: 2
    ctx_len: 1
    future_time_offsets_s: [0.0, 0.2, 0.4]
    loss_latent_weight: 1.0
    # Supervise residual direction explicitly; the action-loss-dominated
    # multi-embodiment gradient otherwise leaves direction cosine near zero.
    latent_cosine_weight: 0.1
    # Keep the latent loss on the predictor: prevent encoder/pooler collapse
    # toward "current == future" (anchor/context are detached from the WM loss).
    detach_wm_input: true
    # Faster delta_scale tracking under multi-embodiment representation drift.
    latent_stats_momentum: 0.9
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    visual_diagnostics: false
    use_state_cond: true
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
    use_state_probe: false
    use_progress_checker: false
    transition_mode: off
  action_model:
    action_model_type: ACT
    action_dim: 7
    action_horizon: 8
    action_hidden_dim: 384
    act_num_heads: 8
    act_num_layers: 3
    act_dim_feedforward: 2048
    act_mlp_hidden_dim: 512
    act_dropout: 0.1
    act_num_state_tokens: 2
    random_prefix_loss_weight: 0.0
    embodiment_heads:
      franka:
        action_spec_id: franka_eef_delta_7
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      oxe_bridge:
        action_spec_id: bridge_eef_delta_7
        action_dim: 7
        action_horizon: 3
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 3]
      oxe_droid:
        action_spec_id: droid_eef_delta_7
        action_dim: 7
        action_horizon: 16
        state_dim: 10
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8, 16]
      kuka:
        action_spec_id: kuka_eef_delta_rpy_gripper_open_abs_7
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      taco_franka:
        action_spec_id: taco_franka_world_delta_scaled_xyz50_rpy20_gripper_open_abs_7_15hz
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      google_bcz:
        action_spec_id: google_bcz_eef_delta_xyz_axis_angle_gripper_open_abs_7_10hz
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      google_rt1:
        action_spec_id: google_rt1_eef_delta_xyz_rpy_gripper_open_abs_7_3hz
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      fmb_franka:
        action_spec_id: fmb_franka_eef_twist_normalized_gripper_open_abs_7_10hz
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
        random_execution_horizons: [1, 2, 4, 8]
      aloha:
        action_spec_id: aloha_dual_joint_14
        action_dim: 14
        action_horizon: 16
        state_dim: 14
        # Packed DataConfig order is [left joints, right joints, left grip, right grip].
        gripper_indices: [12, 13]
        random_execution_horizons: [1, 2, 4, 8, 16]
      so100:
        action_spec_id: so100_joint_abs_6
        action_dim: 6
        action_horizon: 16
        state_dim: 6
        gripper_indices: []
        random_execution_horizons: [1, 2, 4, 8, 16]
      so101:
        action_spec_id: so101_joint_abs_6
        action_dim: 6
        action_horizon: 16
        state_dim: 6
        gripper_indices: []
        random_execution_horizons: [1, 2, 4, 8, 16]
      so_follower:
        action_spec_id: so_follower_joint_abs_6
        action_dim: 6
        action_horizon: 16
        state_dim: 6
        gripper_indices: []
        random_execution_horizons: [1, 2, 4, 8, 16]
  lang_cond:
    type: text
    embed_dim: 384
    text_hidden_dim: 256
    text_depth: 2
    text_heads: 4
    text_ffn_dim: 512
    text_max_length: 128
    text_dropout: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/gaoxiang/data/gaoxiang
    data_mix: unified_libero_robotwin_bridge_droid_kuka_so_family_wm
    dataset_manifests:
      community_so_family: /home/gaoxiang/data/gaoxiang/community_dataset_v3/community_so_family_manifest.json
    # Language is a task ID for this non-VLM model.  Use the authoritative
    # RoboTwin task directory, and deterministic lexical aliases for Bridge.
    task_language_mode: metadata
    task_language_modes:
      franka: canonical_metadata
      aloha: dataset_name
      oxe_bridge: bridge_canonical
      oxe_droid: droid_taxonomy
      kuka: canonical_metadata
      taco_franka: oxe_taxonomy
      google_bcz: oxe_taxonomy
      google_rt1: oxe_taxonomy
      fmb_franka: oxe_taxonomy
      so100: canonical_metadata
      so101: canonical_metadata
      so_follower: canonical_metadata
    future_obs_frames: true
    future_obs_valid_mask: true
    action_valid_mask: true
    include_state: true
    target_num_views: 3
    homogeneous_embodiment_batches: true
    embodiment_sampling_weights:
      franka: 0.19
      oxe_bridge: 0.19
      oxe_droid: 0.19
      aloha: 0.19
      kuka: 0.05
      # Keep the SO family at 19% total while sampling its three calibration
      # spaces approximately in proportion to retained episode counts.
      so100: 0.133
      so101: 0.031
      so_follower: 0.026
    balance_dataset_weights: false
    balance_trajectory_weights: false
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    clear_inactive_trajectory_cache: true
    worker_memory_release_interval: 32
    drop_last: true

trainer:
  max_train_steps: 200000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 2000
  learning_rate:
    base: 5.0e-5
    action_models: 1.0e-4
    backbone:
      encoder: 1.0e-6
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
