run_id: starvla_lewm_unified_pretrain
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_UnifiedPretrain
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: dino_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: true
    num_views: 3
    n_future: 2
    ctx_len: 1
    future_time_offsets_s: [0.0, 0.2, 0.4]
    loss_latent_weight: 1.0
    latent_cosine_weight: 0.0
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    visual_diagnostics: false
    use_state_cond: true
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
    use_state_probe: false
    use_progress_checker: false
    transition_mode: off
  action_model:
    action_model_type: ACT
    action_dim: 7
    action_horizon: 8
    action_hidden_dim: 384
    act_num_heads: 8
    act_num_layers: 3
    act_dim_feedforward: 2048
    act_mlp_hidden_dim: 512
    act_dropout: 0.1
    act_num_state_tokens: 2
    random_prefix_loss_weight: 0.0
    embodiment_heads:
      franka:
        action_spec_id: franka_eef_delta_7
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        random_execution_horizons: [1, 2, 4, 8]
      oxe_bridge:
        action_spec_id: bridge_eef_delta_7
        action_dim: 7
        action_horizon: 3
        state_dim: 8
        random_execution_horizons: [1, 2, 3]
      aloha:
        action_spec_id: aloha_dual_joint_14
        action_dim: 14
        action_horizon: 16
        state_dim: 14
        random_execution_horizons: [1, 2, 4, 8, 16]
  lang_cond:
    type: text
    embed_dim: 384
    text_hidden_dim: 256
    text_depth: 2
    text_heads: 4
    text_ffn_dim: 512
    text_max_length: 128
    text_dropout: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/gaoxiang/data/gaoxiang
    data_mix: unified_libero_robotwin_bridge_wm
    # Language is a task ID for this non-VLM model.  Use the authoritative
    # RoboTwin task directory, and deterministic lexical aliases for Bridge.
    task_language_mode: metadata
    task_language_modes:
      franka: canonical_metadata
      aloha: dataset_name
      oxe_bridge: bridge_canonical
    future_obs_frames: true
    future_obs_valid_mask: true
    include_state: true
    target_num_views: 3
    homogeneous_embodiment_batches: true
    embodiment_sampling_weights:
      franka: 0.333333
      oxe_bridge: 0.333333
      aloha: 0.333334
    balance_dataset_weights: false
    balance_trajectory_weights: false
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true

trainer:
  max_train_steps: 200000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 2000
  learning_rate:
    base: 1.0e-4
    action_models: 1.0e-4
    backbone:
      encoder: 1.0e-6
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
