run_id: gawm_libero_multinode
run_root_dir: .cache/multinode/runs
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_UnifiedPretrain
version_id: '0.21'
framework:
  name: GAWM
  world_model:
    encoder_spec: vitb16
    train_encoder: true
    num_views: 3
    ctx_len: 1
    n_future: 2
    future_time_offsets_s:
    - 0.0
    - 0.2
    - 0.4
    visual_tokens_per_view: 16
    visual_token_dim: 384
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    detach_wm_input: true
    latent_stats_momentum: 0.9
    loss_latent_weight: 1.0
    latent_cosine_weight: 0.1
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    use_state_cond: true
    state_cond_hidden_dim: 256
  action_model:
    action_model_type: ACT
    action_horizon: 8
    action_hidden_dim: 384
    act_num_heads: 8
    act_num_layers: 3
    act_dim_feedforward: 2048
    act_mlp_hidden_dim: 512
    act_dropout: 0.1
    act_num_state_tokens: 2
    embodiment_heads:
      franka:
        action_spec_id: franka_eef_delta_7
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices:
        - 6
  lang_cond:
    type: text
    embed_dim: 384
    text_hidden_dim: 256
    text_depth: 2
    text_heads: 4
    text_ffn_dim: 512
    text_max_length: 128
    text_dropout: 0.1
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: .cache/multinode/data
    data_mix: unified_libero_goal_wm
    per_device_batch_size: 1
    obs_image_size:
    - 224
    - 224
    target_num_views: 3
    video_backend: torchvision_av
    future_obs_frames: true
    future_obs_valid_mask: true
    include_state: true
    action_valid_mask: true
    task_language_mode: metadata
    num_workers: 0
    pin_memory: true
    load_all_data_for_training: true
trainer:
  max_train_steps: 4
  num_warmup_steps: 0
  save_interval: 2
  eval_interval: 2
  logging_frequency: 1
  gradient_clipping: 1.0
  freeze_modules: ''
  is_resume: false
  pretrained_checkpoint: null
  learning_rate:
    base: 0.0001
    action_models: 0.0001
    backbone:
      encoder: 1.0e-06
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  lr_scheduler_type: constant
  scheduler_specific_kwargs: {}
  gradient_accumulation_steps: 2
is_debug: false
