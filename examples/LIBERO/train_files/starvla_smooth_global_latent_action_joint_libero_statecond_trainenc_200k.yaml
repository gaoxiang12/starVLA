run_id: lewm_oft_libero_dinov3b_smooth_global384_statecond_trainenc_200k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_name
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  world_model:
    base_wm: dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: true
    num_views: 2
    n_future: 2
    ctx_len: 1
    world_model_only: false

    # Frozen DINO -> 4x4 cells/view -> shared 768-to-128 projection ->
    # fixed-order 4096-to-384 projection. The policy reads only
    # [z_t, predicted z_t+1, predicted z_t+2], never DINO spatial tokens.
    # train_encoder=true additionally finetunes the DINO backbone jointly.
    smooth_latent_enabled: true
    smooth_action_enabled: true
    smooth_action_loss_weight: 1.0
    smooth_world_model_loss_weight: 1.0
    smooth_latent_grid_size: 4
    smooth_spatial_token_dim: 128
    smooth_latent_dim: 384
    smooth_predictor_dim: 384
    smooth_predictor_depth: 4
    smooth_predictor_heads: 6
    smooth_predictor_ffn: 1024

    # The joint world-model term retains the complete representation objective.
    smooth_prediction_weight: 1.0
    smooth_sigreg_weight: 0.02
    smooth_slow_weight: 0.05
    smooth_acceleration_weight: 0.10
    smooth_temporal_order_weight: 0.05
    smooth_temporal_order_margin: 0.10
    smooth_sigreg_knots: 17
    smooth_sigreg_num_proj: 1024

    predictor_state_dim: 0
    context_correction_state_dim: 0
    rollout_steps: 1
    loss_latent_weight: 0.0
    latent_cosine_weight: 0.0
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_diagnostics: false
    use_state_cond: true
    state_cond_dim: 8
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
    use_state_probe: false
    use_progress_checker: false
    transition_mode: "off"

  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0

  lang_cond:
    num_buckets: 4096
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_smooth_latent_wm_l10_augmented_statecond
    future_obs_frames: true
    future_obs_valid_mask: true
    include_progress: false
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  is_resume: false
  max_train_steps: 200000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 2000
  learning_rate:
    base: 1.0e-4
    backbone:
      encoder: 1.0e-6
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
