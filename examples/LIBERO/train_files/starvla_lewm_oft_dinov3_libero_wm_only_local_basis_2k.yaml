run_id: lewm_oft_libero_dinov3b_wmonly_localbasis_m4r64_fixedmean_2k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_name
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: false
    num_views: 2
    n_future: 2
    ctx_len: 1
    world_model_only: true
    freeze_latent_stats: true

    # Stage A: learn only shared separable coordinates for fixed-mean-centered
    # local increments. The causal student remains zero/frozen, so no training
    # prediction can influence which representation is selected.
    predictable_innovation_enabled: true
    innovation_training_stage: basis
    innovation_rank: 64
    innovation_transition_tokens: 4
    innovation_context_len: 3
    innovation_fixed_mean_path: playground/Checkpoints/lewm_oft_libero_dinov3b_localinc_calibration/train_local_error_mean_8192.pt
    innovation_require_fixed_mean: true
    innovation_min_calibration_samples: 8192
    innovation_predictor_dim: 384
    innovation_predictor_depth: 4
    innovation_predictor_heads: 6
    innovation_predictor_ffn: 1024

    loss_latent_weight: 0.0
    latent_cosine_weight: 0.0
    innovation_code_weight: 0.0
    innovation_capture_weight: 1.0
    innovation_variance_weight: 0.0
    innovation_covariance_weight: 0.0
    innovation_min_std: 0.25

    predictor_state_dim: 0
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.0
    visual_token_variance_weight: 0.0
    visual_token_min_std: 0.1
    latent_stats_momentum: 0.99
    visual_diagnostics: true
    use_state_cond: true
    use_state_probe: false
    use_progress_checker: false
    transition_mode: "off"
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0
  lang_cond:
    num_buckets: 4096
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_wm_l10_augmented_localctx3_h8
    future_obs_frames: true
    include_state: true
    include_progress: false
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  pretrained_checkpoint: playground/Checkpoints/lewm_oft_libero_dinov3b_l10aug489_spatial4x4_trainenc1e6_statecond_220k/checkpoints/steps_220000_pytorch_model.pt
  is_resume: false
  max_train_steps: 2000
  num_warmup_steps: 100
  save_interval: 2000
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-03
    world_model: 1.0e-03
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 25
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
