# Two-step autoregressive rollout continuation of the smooth spatial latent
# world model.  Resumes from the 10k single-shot checkpoint: step 1 keeps the
# teacher-forced [t,t+1,t+2] objective identical to the parent run, while
# step 2 re-anchors the predictor on its own output and supervises the
# residual against the true t+3/t+4 latents (loss_rollout_weight).  The data
# mix supplies [t,t+1,t+2,t+3,t+4,t+8].
run_id: lewm_oft_libero_dinov3b_smooth_spatial_global384_short12_far8_rollout2_10k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_name
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  world_model:
    base_wm: dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: false
    num_views: 2
    n_future: 2
    ctx_len: 1
    world_model_only: true

    # Frozen DINO -> fixed 4x4 cells/view -> shared 128-D token projection ->
    # fixed-order global projection to one 384-D frame latent.
    # The predictor sees current content + task only. No reconstruction,
    # action, state, residual normalization, or predicted-latent SIGReg.
    smooth_latent_enabled: true
    smooth_latent_grid_size: 4
    smooth_spatial_token_dim: 128
    smooth_latent_dim: 384
    smooth_predictor_dim: 384
    smooth_predictor_depth: 4
    smooth_predictor_heads: 6
    smooth_predictor_ffn: 1024
    smooth_prediction_weight: 1.0
    smooth_sigreg_weight: 0.02
    smooth_slow_weight: 0.05
    smooth_acceleration_weight: 0.10
    smooth_temporal_order_weight: 0.05
    smooth_temporal_order_margin: 0.10
    smooth_sigreg_knots: 17
    smooth_sigreg_num_proj: 1024

    # Two-step autoregressive rollout.  Step 1 is the unchanged teacher-forced
    # objective; step 2 supervises the predictor re-anchored on its own output
    # with the same weight as the step-1 prediction loss.
    rollout_steps: 2
    loss_rollout_weight: 1.0

    # All existing LeWMOFT alternatives remain outside this experiment.
    reconstructive_latent_enabled: false
    predictable_innovation_enabled: false
    predictor_state_dim: 0
    loss_latent_weight: 0.0
    latent_cosine_weight: 0.0
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_diagnostics: false
    use_state_cond: false
    use_state_probe: false
    use_progress_checker: false
    transition_mode: "off"

  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0

  lang_cond:
    num_buckets: 4096
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_smooth_latent_wm_l10_augmented_rollout
    future_obs_frames: true
    future_obs_valid_mask: true
    include_progress: false
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  pretrained_checkpoint: playground/Checkpoints/lewm_oft_libero_dinov3b_smooth_spatial_global384_short12_far8_10k/checkpoints/steps_10000_pytorch_model.pt
  is_resume: false
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
