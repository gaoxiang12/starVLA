# Multi-step latent rollout fine-tune, warm-started from the validated 220k run.
#
# Motivation: the 220k objective only ever supervises one re-anchoring step, so
# the predictor is never asked to stay stable when fed its own output.  This run
# adds ``rollout_steps=4`` (covering +4 .. +32 frames at the 4-frame cadence)
# and supervises steps 2..4 against the *predicted* anchor.  Step 1 keeps the
# original teacher-forced loss untouched so ``latent_loss`` stays directly
# comparable with every single-shot checkpoint.
#
# The action head still consumes only the first ``n_future`` predictions, so the
# deployed token layout and every checkpoint shape are unchanged.
run_id: lewm_oft_libero_dinov3b_rollout4_from220k_40k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_name
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: true
    num_views: 2
    n_future: 2
    ctx_len: 1
    num_visual_tokens: 16
    visual_tokens_per_view: 16
    visual_token_dim: 384
    loss_latent_weight: 1.0
    rollout_steps: 4
    loss_rollout_weight: 0.5
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.0
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    latent_stats_momentum: 0.99
    visual_diagnostics: true
    use_state_cond: true
    state_cond_dim: 8
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
    state_cond_only: false
    use_state_probe: false
    use_progress_checker: false
    use_dense_patch_action: false
    dense_patch_freeze_base: true
    transition_mode: false
    progress_anchor_weight: 0.5
    progress_detach_action: true
    progress_detach_latents: true
    progress_ema: 0.8
    progress_goal_weight: 0.2
    progress_loss_weight: 0.2
    progress_ranking_weight: 0.1
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_hidden_dim: 1536
    action_horizon: 8
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0
  lang_cond:
    num_buckets: 4096
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    # Supplies 8 future frames (+4 .. +32), i.e. n_future * rollout_steps.
    data_mix: libero_all_wm_l10_augmented_rollout_h32
    future_obs_frames: true
    include_state: true
    per_device_batch_size: 4
    video_backend: torchvision_av

trainer:
  pretrained_checkpoint: playground/Checkpoints/lewm_oft_libero_dinov3b_l10aug489_spatial4x4_trainenc1e6_statecond_220k/checkpoints/steps_220000_pytorch_model.pt
  is_resume: false
  max_train_steps: 40000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000000
  learning_rate:
    base: 3.0e-05
    action_model: 3.0e-05
    # The encoder already converged at 220k; a rollout objective must not be
    # allowed to reshape the latent space it is measured in.
    backbone:
      encoder: 0.0
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
