run_id: starvla_lewm_oft_wm
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: WinKawaks/vit-tiny-patch16-224
    train_encoder: false   # frozen ViT; set true for joint fine-tuning
    # === flow-matching latent world model (ported le-wm WanPredictor) ===
    use_future_latent: true   # roll out future latents; flow head predicts actions from them
    n_future: 2               # number of future latents (must divide action_horizon)
    ctx_len: 1                # clean context frames (current frame only)
    predictor_dim: 384
    predictor_layers: 4
    predictor_heads: 6
    predictor_ffn: 1024
    flow_sample_steps: 10     # denoising steps for inference rollout
    loss_latent_weight: 0.0   # LATENT FLOW OFF: pooled DINOv2 latent is a bad flow target
    loss_action_weight: 0.5   # optional action-flow auxiliary / flow-action ablation
    # === direct delta-regression head (PRIMARY latent predictor) ===
    # The flow WM never beat copy on the pooled DINOv2 latent (1.57x worse,
    # cos-dir 0.02). The repo's canonical LeWM/JEPA instead regresses the
    # future embedding directly (MSE + SIGReg, no flow, no whitening) -> we do
    # the same: a le-wm ARPredictor-style transformer delta head with a global
    # residual scale (NO per-dim whitening) + SIGReg anti-collapse. The delta
    # head must NOT see future actions on the OFT path; otherwise training leaks
    # GT actions into the future latent before predicting the same actions.
    # Enable on a NEW run_id / resume with strict=False (old MLP delta_head + new
    # transformer weights differ).
    use_delta_head: true
    loss_delta_weight: 1.0        # delta head is now the primary latent objective
    delta_head_type: transformer  # "mlp" (legacy) | "transformer" (ARPredictor-style)
    delta_head_dim: 384
    delta_head_depth: 4
    delta_head_heads: 6
    delta_head_ffn: 1024
    delta_head_sigreg_weight: 0.02  # SIGReg weight (>0 enables the regularizer)
    delta_head_condition_on_action: false  # action-free future latent predictor; no GT-action shortcut
    delta_head_hidden: 1024         # only used by the legacy mlp head
    delta_head_inference: true      # rollout uses the delta head, not the flow latent
    oft_future_from_delta: true     # OFT head conditions on the delta future latent
    # === state probe: ground predicted future latents in future proprio ===
    use_state_probe: true
    state_dim: 8              # LIBERO proprio: x,y,z,roll,pitch,yaw,pad,gripper
    loss_state_weight: 0.5
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0
  lang_cond:
    num_buckets: 4096
    embed_dim: 384   # task embedding dim; matches ViT-tiny latent (2*192=384)

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_wm        # loads current + future frames for latent loss
    future_obs_frames: true        # pack future_images in _pack_sample
    include_state: true            # pack aligned future proprio for the state probe
    action_type: delta_qpos
    sequential_step_sampling: False
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
