run_id: starvla_lewm_oft_wm
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: WinKawaks/vit-tiny-patch16-224
    train_encoder: false   # frozen ViT; set true for joint fine-tuning
    n_future: 2               # future visual-token frames predicted in parallel
    ctx_len: 1                # clean context frames (current frame only)
    loss_latent_weight: 1.0
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.02
    # === state probe: ground predicted future latents in future proprio ===
    use_state_probe: true
    state_dim: 8              # LIBERO proprio: x,y,z,roll,pitch,yaw,pad,gripper
    loss_state_weight: 0.5
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8]
    random_prefix_loss_weight: 0.0
  lang_cond:
    num_buckets: 4096
    embed_dim: 384   # task embedding dim; matches ViT-tiny latent (2*192=384)

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all_wm        # loads current + future frames for latent loss
    future_obs_frames: true        # pack future_images in _pack_sample
    include_state: true            # pack aligned future proprio for the state probe
    action_type: delta_qpos
    sequential_step_sampling: False
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
