    dataset_py: robotwin_official_hdf5
    data_root_dir: playground/Datasets/LiLaWAM_RoboTwin_Official
    data_mix: robotwin_official_hdf5
    action_horizon: 32
    future_recorded_offsets:
    - 0
    - 16
    - 32
    obs_image_size:
    - 320
    - 240
    num_workers: 4
    prefetch_factor: 2
