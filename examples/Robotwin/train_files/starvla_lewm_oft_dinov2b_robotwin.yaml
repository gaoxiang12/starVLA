run_id: lewm_oft_robotwin_dinov2b
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_RoboTwin
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  qwenvl:
    base_vlm: WinKawaks/vit-tiny-patch16-224
  world_model:
    base_wm: facebook/dinov2-base
    train_encoder: true
    num_views: 3
    n_future: 2
    ctx_len: 1
    loss_latent_weight: 1.0
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    latent_stats_momentum: 0.99
    visual_diagnostics: true
    use_state_probe: false
    use_state_cond: true
    state_cond_dim: 14
    state_cond_hidden_dim: 256
    state_cond_dropout: 0.1
  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8, 16]
    random_prefix_loss_weight: 0.0
  lang_cond:
    num_buckets: 65536
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_all_wm
    # All episodes in one RoboTwin task share one stable language/task ID.
    task_language_mode: dataset_name
    future_obs_frames: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  max_train_steps: 200000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 2000
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
    backbone:
      encoder: 1.0e-06
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
