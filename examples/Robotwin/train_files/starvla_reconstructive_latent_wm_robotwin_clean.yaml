run_id: lewm_oft_robotwin_dinov3b_clean_reconstructive_latent_joint_50k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_name
wandb_project: starVLA_RoboTwin
is_debug: false
version_id: "0.21"

framework:
  name: LeWMOFT
  world_model:
    base_wm: dinov3_weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    train_encoder: false
    num_views: 3
    n_future: 2
    ctx_len: 1
    world_model_only: true
    freeze_latent_stats: false

    # Joint, single-flow experiment over fixed DINO spatial patches.
    # Trainable modules are the codec, compact predictor, state decoder, and
    # task embedding. State/action are never predictor inputs.
    reconstructive_latent_enabled: true
    reconstructive_pool_grid_size: 4
    reconstructive_latent_grid_size: 2
    reconstructive_latent_dim: 256
    reconstructive_codec_hidden_dim: 512
    reconstructive_state_dim: 14
    reconstructive_state_hidden_dim: 512
    reconstructive_predictor_dim: 256
    reconstructive_predictor_depth: 4
    reconstructive_predictor_heads: 8
    reconstructive_predictor_ffn: 1024
    reconstructive_reconstruction_weight: 1.0
    reconstructive_prediction_weight: 1.0
    reconstructive_state_weight: 0.5
    latent_stats_momentum: 0.99

    # Legacy branches remain disabled but their shapes stay checkpoint-safe.
    predictor_state_dim: 0
    loss_latent_weight: 0.0
    latent_cosine_weight: 0.0
    residual_predictor_sigreg_weight: 0.0
    visual_tokens_per_view: 16
    visual_token_dim: 384
    visual_token_diversity_weight: 0.0
    visual_token_variance_weight: 0.0
    visual_diagnostics: false
    use_state_cond: false
    use_state_probe: false
    use_progress_checker: false
    transition_mode: "off"
    predictable_innovation_enabled: false

  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    action_hidden_dim: 384
    random_execution_horizons: [1, 2, 4, 8, 16]
    random_prefix_loss_weight: 0.0

  lang_cond:
    num_buckets: 65536
    embed_dim: 384

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_clean_reconstructive_wm
    # All episodes in one RoboTwin task share one stable language/task ID.
    task_language_mode: dataset_name
    future_obs_frames: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  is_resume: false
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
