run_id: gawm_s_base_robotwin_clean1000_49tasks_40k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_RoboTwin
is_debug: false
version_id: "0.21"

framework:
  name: GAWM
  world_model:
    encoder_spec: vitb16
    train_encoder: true
    num_views: 3
    ctx_len: 1
    n_future: 2
    future_time_offsets_s: [0.0, 0.2, 0.4]
    visual_tokens_per_view: 16
    visual_token_dim: 384
    residual_predictor_dim: 384
    residual_predictor_depth: 4
    residual_predictor_heads: 6
    residual_predictor_ffn: 1024
    detach_wm_input: true
    latent_stats_momentum: 0.9
    loss_latent_weight: 1.0
    latent_cosine_weight: 0.1
    visual_token_diversity_weight: 0.02
    visual_token_variance_weight: 0.02
    visual_token_min_std: 0.1
    use_state_cond: true
    state_cond_hidden_dim: 256

  action_model:
    action_model_type: ACT
    action_horizon: 8
    action_hidden_dim: 384
    act_num_heads: 8
    act_num_layers: 3
    act_dim_feedforward: 2048
    act_mlp_hidden_dim: 512
    act_dropout: 0.1
    act_num_state_tokens: 2
    embodiment_heads:
      aloha:
        action_spec_id: aloha_dual_joint_14
        action_dim: 14
        action_horizon: 16
        state_dim: 14
        gripper_indices: [6, 13]
      franka:
        action_spec_id: franka_eef_delta_7
        action_dim: 7
        action_horizon: 8
        state_dim: 8
        gripper_indices: [6]
      oxe_bridge:
        action_spec_id: bridge_eef_delta_7
        action_dim: 7
        action_horizon: 3
        state_dim: 8
        gripper_indices: [6]

  lang_cond:
    type: text
    embed_dim: 384
    text_hidden_dim: 256
    text_depth: 2
    text_heads: 4
    text_ffn_dim: 512
    text_max_length: 128
    text_dropout: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/gaoxiang/data/gaoxiang
    # This legacy registry name currently resolves to 49 Clean tasks x 1000 episodes.
    data_mix: unified_robotwin_generated_clean500_wm
    task_language_mode: metadata
    task_language_modes:
      aloha: dataset_name
    future_obs_frames: true
    future_obs_valid_mask: true
    action_valid_mask: true
    include_state: true
    target_num_views: 3
    homogeneous_embodiment_batches: true
    embodiment_sampling_weights:
      aloha: 1.0
    balance_dataset_weights: false
    balance_trajectory_weights: false
    sequential_step_sampling: false
    normalization_statistics_path: examples/Robotwin/train_files/gawm_s_base_aloha_statistics.json
    per_device_batch_size: 8
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true

trainer:
  max_train_steps: 40000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 2000
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  freeze_modules: "action_models.franka,action_models.oxe_bridge"
  is_resume: false
  pretrained_checkpoint: playground/Checkpoints/GAWM-S-base/checkpoints/steps_160000_pytorch_model.pt
  learning_rate:
    base: 1.0e-5
    action_models: 3.0e-5
    backbone:
      encoder: 1.0e-7
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-8
